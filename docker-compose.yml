name: northwind-realtime-platform

services:
  spark-runner:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    environment:
      POSTGRES_HOST: postgres-staging
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DB: "${CLICKHOUSE_DB}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"

    depends_on:
      postgres-staging:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

    networks:
      - northwind_net

    volumes:
      - ./spark:/opt/spark/work-dir/spark:ro

    profiles:
      - tools

    restart: "no"
    mem_limit: 1500m
    cpus: 1.0
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.24.4

    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DB}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/clickhouse:/docker-entrypoint-initdb.d:ro
      - ./docker/clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./docker/clickhouse/users.d/low-memory-profile.xml:/etc/clickhouse-server/users.d/low-memory-profile.xml:ro

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client
          --host 127.0.0.1
          --user "$$CLICKHOUSE_USER"
          --password "$$CLICKHOUSE_PASSWORD"
          --query "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - northwind_net

    restart: unless-stopped

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    mem_limit: 1600m
    cpus: 1.0
  etl-runner:
    build:
      context: .
      dockerfile: docker/etl/Dockerfile

    environment:
      MSSQL_HOST: mssql
      MSSQL_PORT: "1433"
      MSSQL_DATABASE: Northwind_OLTP
      MSSQL_USER: sa
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

      POSTGRES_HOST: postgres-staging
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    depends_on:
      mssql:
        condition: service_healthy
      postgres-staging:
        condition: service_healthy

    networks:
      - northwind_net

    volumes:
      - ./etl:/app/etl:ro
      - ./data-lake:/data-lake


    profiles:
      - tools

    restart: "no"
    mem_limit: 512m
    cpus: 0.5

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_MEMORY_LIMIT_MB: "2048"
      MSSQL_AGENT_ENABLED: "true"

    ports:
      - "127.0.0.1:1433:1433"

    volumes:
      - mssql_data:/var/opt/mssql
      - ./database/backup:/var/opt/mssql/backup:ro
      - ./sql/mssql:/scripts:ro

    networks:
      - northwind_net

    restart: unless-stopped
    mem_limit: 2500m
    cpus: 1.5

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  postgres-staging:
    image: postgres:17

    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro

    networks:
      - northwind_net

    restart: unless-stopped
    mem_limit: 700m
    cpus: 0.5

    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mssql_data:
  postgres_staging_data:
  clickhouse_data:


networks:
  northwind_net:
    driver: bridge
