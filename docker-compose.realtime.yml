services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka

    ports:
      - "127.0.0.1:29092:9092"

    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:29092,PLAINTEXT://kafka:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_LOG_SEGMENT_BYTES: "134217728"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/19092'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

    networks:
      - northwind_net

    restart: unless-stopped
    mem_limit: 900m
    cpus: 0.75

  mongodb:
    image: mongo:8.0.29

    command:
      - mongod
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.25"

    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD}"
      MONGO_INITDB_DATABASE: "${MONGO_DATABASE}"
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/27017'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

    networks:
      - northwind_net

    restart: unless-stopped
    mem_limit: 600m
    cpus: 0.50


  cdc-producer:
    build:
      context: .
      dockerfile: docker/etl/Dockerfile

    command:
      - python
      - -m
      - kafka.cdc_producer

    environment:
      MSSQL_HOST: mssql
      MSSQL_PORT: "1433"
      MSSQL_DATABASE: Northwind_OLTP
      MSSQL_USER: sa
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

      POSTGRES_HOST: postgres-staging
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_CLIENT_ID: northwind-cdc-producer

      CDC_START_MODE: latest
      CDC_POLL_INTERVAL_SECONDS: "2"
      CDC_RETRY_SECONDS: "5"
      CDC_FLUSH_TIMEOUT_SECONDS: "30"

    depends_on:
      mssql:
        condition: service_healthy
      postgres-staging:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - northwind_net

    init: true
    restart: unless-stopped
    mem_limit: 320m
    cpus: 0.35


  cdc-consumer:
    build:
      context: .
      dockerfile: docker/etl/Dockerfile

    command:
      - python
      - -m
      - kafka.cdc_consumer

    environment:
      POSTGRES_HOST: postgres-staging
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_GROUP_ID: northwind-cdc-staging-v1
      KAFKA_DLQ_TOPIC: northwind.cdc.dlq

      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DATABASE: "${MONGO_DATABASE}"
      MONGO_USERNAME: "${MONGO_ROOT_USERNAME}"
      MONGO_PASSWORD: "${MONGO_ROOT_PASSWORD}"
      MONGO_AUTH_SOURCE: admin
      MONGO_LOG_COLLECTION: pipeline_logs

      CDC_RETRY_SECONDS: "5"

    depends_on:
      postgres-staging:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy

    networks:
      - northwind_net

    init: true
    restart: unless-stopped
    mem_limit: 350m
    cpus: 0.35

volumes:
  kafka_data:
  mongodb_data: